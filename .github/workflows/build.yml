name: Build and Release

on:
  push:
    tags:
      - 'v*'
      - '*beta*'

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      
      - name: setup jdk
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'
      
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew       
      
      - name: build
        run: ./gradlew build
      
      - name: Determine release type
        id: release-type
        run: |
          if [[ "${{ github.ref_name }}" == *beta* ]]; then
            echo "is_beta=true" >> $GITHUB_OUTPUT
            echo "output_name=Beta ${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "is_beta=false" >> $GITHUB_OUTPUT
            echo "output_name=Release ${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: upload
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          files: build/libs/*.jar

          version: ${{ github.ref_name }}
          changelog-file: CHANGELOG.md

          modrinth-id: L0g6pT9H
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-files: build/libs/!(*-@(dev\|sources\|javadoc)).jar

          curseforge-id: 1602408
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          curseforge-files: build/libs/!(*-@(dev\|sources\|javadoc)).jar

          github-token: ${{ secrets.TOKEN }}

          dependencies: |
            YetAnotherConfigLib@3.8.2+1.21.11-fabric(required){modrinth:1eAoo2KR}{curseforge:667299}#(ignore:github)
            fabric-api@0.141.3+1.21.11(required){modrinth:P7dR8mSH}{curseforge:306612}#(ignore:github)
            Mod Menu@17.0.0(optional){modrinth:mOgUt4GM}{curseforge:308702}#(ignore:github)